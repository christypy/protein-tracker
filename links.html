<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的網站</title>
  <meta name="theme-color" content="#365a41">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23365a41'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='14' width='16' height='16' rx='4'/%3E%3Crect x='34' y='14' width='16' height='16' rx='4'/%3E%3Crect x='14' y='34' width='16' height='16' rx='4'/%3E%3Crect x='34' y='34' width='16' height='16' rx='4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAF6EF;
      --card: #FFFFFF;
      --ink: #2B2621;
      --ink-soft: #847A6C;
      --line: #E7DECB;
      --green: #365a41;
      --green-tint: #E4EEE3;
      --fat: #C9924B;
      --fat-tint: #F6ECDA;
      --blue: #5679A0;
      --blue-tint: #E5EDF4;
      --purple: #8A6BA1;
      --purple-tint: #EFE8F3;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(43, 38, 33, 0.04), 0 6px 20px rgba(43, 38, 33, 0.06);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 1px 1px, rgba(43, 38, 33, 0.045) 1px, transparent 0);
      background-size: 22px 22px;
      min-height: 100vh;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 18px 64px;
    }

    h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px;
      margin: 0 0 6px;
    }

    .sub {
      margin: 0 0 28px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .1s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .link-card:hover { border-color: var(--accent); }
    .link-card:active { transform: scale(0.98); }

    .icon {
      flex: none;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: var(--tint);
    }

    .text { flex: 1; min-width: 0; }

    .name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .url {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      flex: none;
      font-size: 18px;
      color: var(--accent);
    }

    .cafe { --accent: var(--fat); --tint: var(--fat-tint); }
    .body { --accent: var(--green); --tint: var(--green-tint); }
    .value { --accent: var(--blue); --tint: var(--blue-tint); }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>我的網站</h1>
    <p class="sub">點一下就會開啟對應的系統。</p>

    <div class="links">
      <a class="link-card cafe" href="https://christypy.github.io/">
        <span class="icon">☕</span>
        <span class="text">
          <span class="name">一味淨生活咖啡系統</span>
          <div class="url">christypy.github.io</div>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-card body" href="https://christypy.github.io/protein-tracker/">
        <span class="icon">🏋️</span>
        <span class="text">
          <span class="name">身體管理</span>
          <div class="url">christypy.github.io/protein-tracker</div>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-card body" href="https://christypy.github.io/my-finance-tracker/">
        <span class="icon">🐷</span>
        <span class="text">
          <span class="name">我的存摺 · 個人存款管理</span>
          <div class="url">christypy.github.io/my-finance-tracker</div>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link-card value" href="https://christypy.github.io/cp-tracker/">
        <span class="icon">🧾</span>
        <span class="text">
          <span class="name">CP值帳本</span>
          <div class="url">christypy.github.io/cp-tracker</div>
        </span>
        <span class="arrow">›</span>
      </a>
    </div>
    <p class="sub" style="margin:28px 0 0;text-align:center;font-size:11px;">連結頁版本 v3・共 4 個網站</p>
  </div>
</body>

</html>
